<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40">
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="40" rx="8" fill="#0d1117"/>

  <g font-family="Consolas, Menlo, monospace" font-size="28" font-weight="bold" fill="#00f0ff" filter="url(#glow)">
    <text x="2" y="29">[</text>
    <text x="664" y="29">]</text>
  </g>

  <!-- empty blocks (░) -->
  <g fill="#8b949e" fill-opacity="0.25">
    <rect x="16" y="10" width="60" height="20" rx="3"/>
    <rect x="80" y="10" width="60" height="20" rx="3"/>
    <rect x="144" y="10" width="60" height="20" rx="3"/>
    <rect x="208" y="10" width="60" height="20" rx="3"/>
    <rect x="272" y="10" width="60" height="20" rx="3"/>
    <rect x="336" y="10" width="60" height="20" rx="3"/>
    <rect x="400" y="10" width="60" height="20" rx="3"/>
    <rect x="464" y="10" width="60" height="20" rx="3"/>
    <rect x="528" y="10" width="60" height="20" rx="3"/>
    <rect x="592" y="10" width="60" height="20" rx="3"/>
  </g>

  <!-- filled neon blocks (█) -->
  <g filter="url(#glow)" opacity="1">
    <rect x="16" y="10" width="60" height="20" rx="3" fill="#00f0ff" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.08;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="80" y="10" width="60" height="20" rx="3" fill="#00d4ff" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.16;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="144" y="10" width="60" height="20" rx="3" fill="#00b8ff" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.24;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="208" y="10" width="60" height="20" rx="3" fill="#4d9dff" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.32;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="272" y="10" width="60" height="20" rx="3" fill="#8a7dff" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.40;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="336" y="10" width="60" height="20" rx="3" fill="#b66cff" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.48;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="400" y="10" width="60" height="20" rx="3" fill="#e055ff" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.56;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="464" y="10" width="60" height="20" rx="3" fill="#ff3df2" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.64;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="528" y="10" width="60" height="20" rx="3" fill="#ff2fb9" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.72;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="592" y="10" width="60" height="20" rx="3" fill="#ff2a85" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.80;0.95;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- percentage counter -->
  <g font-family="Consolas, Menlo, monospace" font-size="24" font-weight="bold" fill="#39ff14" text-anchor="end" filter="url(#glow)">
    <text x="792" y="28">0%<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.08;0.95" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
    <text x="792" y="28" opacity="0">10%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.08;0.16" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
    <text x="792" y="28" opacity="0">20%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.16;0.24" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
    <text x="792" y="28" opacity="0">30%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.24;0.32" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
    <text x="792" y="28" opacity="0">40%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.32;0.40" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
    <text x="792" y="28" opacity="0">50%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.40;0.48" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
    <text x="792" y="28" opacity="0">60%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.48;0.56" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
    <text x="792" y="28" opacity="0">70%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.56;0.64" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
    <text x="792" y="28" opacity="0">80%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.64;0.72" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
    <text x="792" y="28" opacity="0">90%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.72;0.80" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
    <text x="792" y="28" opacity="0">100%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.80;0.95" calcMode="discrete" dur="5s" repeatCount="indefinite"/></text>
  </g>
</svg>
